syntax = "proto3";

package fastcdn;

// 管理员服务
service Admin {
	// 创建管理员
	rpc create (AdminCreateRequest) returns (AdminCreateResponse);
	// 登录
	rpc login(AdminLoginRequest) returns (AdminLoginResponse);

	// 创建或修改管理员
	rpc createOrUpdateAdmin (CreateOrUpdateAdminRequest) returns (CreateOrUpdateAdminResponse);
}

// 创建或修改管理员
message CreateOrUpdateAdminRequest {
	string username = 1;
	string password = 2;
}

message CreateOrUpdateAdminResponse {
	int64 id = 1;
}

// 创建管理员
message AdminCreateRequest {
	string username = 1;
	string password = 2;
	string fullname = 3;
	bytes modulesJSON = 4;
	bool isSuper = 5;
	bool canLogin = 6;
}

message AdminCreateResponse {
	int64 id = 1;
}


// 登录
message AdminLoginRequest {
	string username = 1;
	string password = 2;
}

message AdminLoginResponse {
	bool status = 1;
	int64 id = 2;
	string message = 3;
}